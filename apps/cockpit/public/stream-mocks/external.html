<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stream integration mock</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { display: grid; place-items: center; }
    .mock { display: grid; place-items: center; width: 100%; height: 100%; color: #f5f5f5; background: linear-gradient(135deg, rgba(13,17,26,.94), rgba(37,48,72,.9)); }
    .mock.empty { background: transparent; }
    .card { max-width: 80%; padding: 2rem 2.5rem; border: 2px solid #e4b83f; background: rgba(0,0,0,.72); text-align: center; }
    h1 { margin: 0 0 .5rem; color: #e4b83f; font-size: clamp(1.4rem, 3vw, 3rem); }
    p { margin: .25rem 0; font-size: clamp(.9rem, 1.4vw, 1.4rem); }
    .border { width: 90%; height: 80%; border: clamp(4px, .5vw, 10px) solid #e4b83f; box-shadow: 0 0 0 3px #111, inset 0 0 0 3px rgba(255,255,255,.35); }
    .watermark { align-self: start; justify-self: end; margin: 2%; padding: .5rem 1rem; color: #e4b83f; font-size: clamp(1rem, 2vw, 2rem); font-weight: 900; letter-spacing: .12em; }
  </style>
</head>
<body>
  <main id="mock" class="mock"></main>
  <script>
    const kind = new URLSearchParams(location.search).get('kind') || 'integration';
    const mock = document.querySelector('#mock');
    const content = {
      'pip-border': '<div class="border" aria-label="PiP gold border"></div>',
      'vdo-ninja': '<div class="card"><h1>VDO.Ninja camera mock</h1><p>Local end-to-end placeholder for the commentator PiP.</p></div>',
      'discord': '<div class="card"><h1>Discord voice overlay mock</h1><p>Commentator voice status appears here in OBS.</p></div>',
      'youtube': '',
      'watermark': '<div class="watermark">SIM RACING ALLIANCE</div>'
    };
    const markup = content[kind] || content.youtube;
    mock.classList.toggle('empty', !markup);
    mock.innerHTML = markup;
  </script>
</body>
</html>
